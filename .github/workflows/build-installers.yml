name: Build installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            command: npm run dist:mac
            artifact: release/*.dmg
          - platform: Windows
            os: windows-latest
            command: npm run dist:win
            artifact: release/*.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download VLC runtime for macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/vlc-3.0.24-universal.dmg"
          mount="$RUNNER_TEMP/vlc-mount"
          curl --fail --location --silent --show-error \
            https://get.videolan.org/vlc/3.0.24/macosx/vlc-3.0.24-universal.dmg \
            --output "$archive"
          echo "2c8e89f7f42e53c2fb0e87b6dfa39b49f1364b25080aaa2e476ac74c0d7beb3c  $archive" | shasum -a 256 --check
          mkdir -p "$mount"
          hdiutil attach "$archive" -nobrowse -readonly -mountpoint "$mount"
          echo "VLC_RUNTIME_DIR=$mount/VLC.app/Contents/MacOS" >> "$GITHUB_ENV"

      - name: Download VLC runtime for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'vlc-3.0.24-win64.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'vlc-win64'
          curl.exe --fail --location --silent --show-error `
            --output $archive `
            'https://get.videolan.org/vlc/3.0.24/win64/vlc-3.0.24-win64.zip'
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to download the VLC archive.'
          }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Downloaded VLC archive SHA-256: $hash"
          if ($hash -ne 'fcf30850371ad10c9373cc4f0f4501e7dee49e3e9ae9f20c72fb2661a1ca6323') {
            throw 'VLC archive SHA-256 verification failed.'
          }
          Expand-Archive -Path $archive -DestinationPath $extract
          $runtime = Get-ChildItem $extract -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName 'libvlc.dll')
          } | Select-Object -First 1
          if (-not $runtime) {
            throw 'The VLC archive does not contain libvlc.dll.'
          }
          "VLC_RUNTIME_DIR=$($runtime.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowDeck-Pro-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Attach installers to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --generate-notes
          fi
